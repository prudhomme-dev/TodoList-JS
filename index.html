<!DOCTYPE html>
<html lang="fr" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <meta http-equiv="cache-control" content="no-cache">
    <title>TodoList</title>
    <script src="js/theme.js"></script>
    <link rel="stylesheet" href="css/normalize.css">
    <link rel="stylesheet" href="css/todolist.css">
</head>

<body>

    <main>
        <header class="appHeader">
            <h1>Ma Todo-List</h1>
        </header>

        <button type="button" id="themeToggle" class="themeToggle" aria-label="Passer en thème sombre">
            <svg class="iconSun" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" aria-hidden="true">
                <circle cx="12" cy="12" r="4.5" />
                <path d="M12 2.5v2M12 19.5v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M2.5 12h2M19.5 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4" />
            </svg>
            <svg class="iconMoon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M20.5 14.2A8.5 8.5 0 1 1 9.8 3.5a6.8 6.8 0 0 0 10.7 10.7z" />
            </svg>
        </button>

        <section class="action" aria-label="Ajouter une tâche">
            <input type="text" name="newTask" id="newTask" placeholder="Quelle tâche à ajouter ?" autocomplete="off"
                aria-label="Nouvelle tâche">
            <div class="priorityMobile" role="group" aria-label="Priorité de la tâche">
                <button type="button" class="priorityTask lowPriority" data-priority="0"
                    aria-label="Priorité basse"></button>
                <button type="button" class="priorityTask normalPriority selectPriority" data-priority="1"
                    aria-label="Priorité normale"></button>
                <button type="button" class="priorityTask importantPriority" data-priority="2"
                    aria-label="Priorité haute"></button>
            </div>
            <p class="actionHint">Appuyez sur <kbd>Entrée</kbd> pour ajouter la tâche</p>
        </section>

        <section class="list" aria-live="polite"></section>

        <p class="taskCounter" aria-hidden="true"></p>

        <h2 class="taskArchivedTitle">Tâches archivées</h2>
        <section class="listArchives"></section>
    </main>

    <footer>
        <p><small class="copyright">2022 - Cédric PRUD'HOMME -
                <a rel="license" href="http://creativecommons.org/licenses/by-nc-sa/4.0/"><img
                        alt="Licence Creative Commons"
                        src="https://i.creativecommons.org/l/by-nc-sa/4.0/80x15.png" /></a></small></p>
    </footer>

    <script src="js/todolist.js"></script>

</body>

</html>
